    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Lateef:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ilmizo_theme_mode_v1');
          var mode = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : null;
          if (!mode) {
            var legacyRaw = localStorage.getItem('ilmizo_master_state_v1');
            if (legacyRaw) {
              var legacy = JSON.parse(legacyRaw);
              if (legacy && legacy.user && legacy.user.themeMode) {
                mode = legacy.user.themeMode;
              } else if (legacy && legacy.user && legacy.user.darkMode === true) {
                mode = 'dark';
              }
            }
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'dark' ? 'dark' : mode === 'system' ? (prefersDark ? 'dark' : 'light') : 'light';
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-app)] text-[var(--text-primary)] antialiased selection:bg-emerald-700 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
